services:
  - type: web
    name: e-pharmacy-admin-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: ADMIN_NAME
        value: Clayton Santos
      - key: ADMIN_EMAIL
        value: vendor@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
